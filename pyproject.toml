[project]
name = "bottleneck-data-pipeline"
version = "0.1.0"
description = "Pipeline DuckDB orchestré avec Kestra pour réconcilier les ventes ERP et web."
authors = [{ name = "Nassim" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb==1.3.2",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "xlwt==1.3.0",
]

[project.scripts]
bottleneck-pipeline = "data_pipeline.cli:main"

[tool.poetry]
packages = [{ include = "data_pipeline", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
